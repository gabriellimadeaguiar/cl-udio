<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:var(--figma-color-bg,#fff);
    --surface:var(--figma-color-bg-secondary,#f5f5f5);
    --ink:var(--figma-color-text,#1e1e1e);
    --ink-2:var(--figma-color-text-secondary,#5b5b5b);
    --line:var(--figma-color-border,#e0e0e0);
    --accent:var(--figma-color-bg-brand,#0d99ff);
    --accent-ink:var(--figma-color-text-onbrand,#fff);
    --warn:#b45309; --warn-bg:#fbefe0; --warn-line:#e5bc8a;
    --err:#1d4ed8; --err-bg:#e5ebfa; --err-line:#a3b8ee;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{--warn:#fbbf24;--warn-bg:#2e2312;--warn-line:#7a5c1e;
          --err:#8fb0f7;--err-bg:#161f3a;--err-line:#3d5490}
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:12px;line-height:1.45;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;height:100vh}
  .bar{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex:none}
  .urlrow{display:flex;gap:8px;align-items:center}
  .gloss{flex:1;min-width:0;font-size:11px;color:var(--ink-2);line-height:1.35}
  .gloss b{color:var(--ink);font-weight:600}
  .gloss .warn{color:var(--warn);font-weight:600}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button{font-family:inherit;font-size:11px;font-weight:600;padding:6px 11px;border-radius:5px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button:disabled{opacity:.5;cursor:default}
  .status{font-size:11px;color:var(--ink-2);min-height:16px}
  .status.bad{color:#c0392b}
  .list{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .empty{color:var(--ink-2);text-align:center;padding:28px 12px;font-size:12px;line-height:1.6}
  .empty b{color:var(--ink);display:block;margin-bottom:4px}
  .f{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;
    background:var(--surface);padding:9px 10px;display:flex;flex-direction:column;gap:6px}
  .f.traduzir{border-left-color:var(--err)}
  .f.decidir{border-left-color:var(--warn)}
  .f.done{opacity:.5}
  .ftop{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
  .tag{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;padding:2px 6px;border-radius:3px}
  .traduzir .tag{background:var(--err-bg);color:var(--err);border:1px solid var(--err-line)}
  .decidir .tag{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
  .term{font-family:var(--mono);font-weight:600;font-size:12px}
  .layer{font-size:10.5px;color:var(--ink-2);margin-left:auto;font-family:var(--mono);
    overflow:hidden;text-overflow:ellipsis;max-width:45%;white-space:nowrap}
  .txt{font-family:var(--mono);font-size:11px;color:var(--ink-2);word-break:break-word;
    padding-left:8px;border-left:2px solid var(--line)}
  .hint{font-size:11px;color:var(--ink-2)}
  .hint b{color:var(--ink);font-family:var(--mono)}
  .acts{display:flex;gap:5px;flex-wrap:wrap}
  .acts button{padding:4px 9px;font-size:10.5px}
  .foot{padding:9px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:center;gap:8px;flex:none;font-size:11px;color:var(--ink-2)}
</style>
</head>
<body>
  <div class="bar">
    <div class="urlrow">
      <div class="gloss" id="gloss">glossário embutido</div>
      <button id="scan" class="primary">Verificar</button>
    </div>
    <div class="status" id="status">Selecione camadas — ou nada, para a página inteira.</div>
  </div>

  <div class="list" id="list">
    <div class="empty">
      <b>Nada verificado ainda</b>
      Selecione camadas (ou nada, para a página inteira) e clique em Verificar.
    </div>
  </div>

  <div class="foot">
    <span id="foot"></span>
    <button id="close">Fechar</button>
  </div>

<script>
const $ = s => document.querySelector(s);
const parent_ = window.parent;
let results = [];

function send(msg){ parent_.postMessage({pluginMessage: msg}, '*'); }
function status(text, bad){ const s = $('#status'); s.textContent = text; s.className = 'status' + (bad ? ' bad' : ''); }

function render(){
  const list = $('#list');
  list.textContent = '';
  if(!results.length){
    const e = document.createElement('div');
    e.className = 'empty';
    const b = document.createElement('b');
    b.textContent = 'Nenhum problema encontrado';
    e.appendChild(b);
    e.appendChild(document.createTextNode('Os textos verificados estão de acordo com o glossário.'));
    list.appendChild(e);
    return;
  }
  results.forEach((r, i) => {
    const f = document.createElement('div');
    f.className = 'f ' + r.decision + (r.done ? ' done' : '');

    const top = document.createElement('div'); top.className = 'ftop';
    const tag = document.createElement('span'); tag.className = 'tag';
    tag.textContent = r.decision === 'traduzir' ? 'evitar' : 'em discussão';
    const term = document.createElement('span'); term.className = 'term'; term.textContent = r.term;
    const layer = document.createElement('span'); layer.className = 'layer'; layer.textContent = r.name;
    top.append(tag, term, layer);
    f.appendChild(top);

    const txt = document.createElement('div'); txt.className = 'txt'; txt.textContent = r.text;
    f.appendChild(txt);

    if(r.decision === 'traduzir' && r.prefer){
      const h = document.createElement('div'); h.className = 'hint';
      h.appendChild(document.createTextNode('Usar '));
      const b = document.createElement('b'); b.textContent = r.prefer;
      h.appendChild(b);
      f.appendChild(h);
    }
    if(r.note){
      const n = document.createElement('div'); n.className = 'hint'; n.textContent = r.note;
      f.appendChild(n);
    }

    const acts = document.createElement('div'); acts.className = 'acts';
    const go = document.createElement('button'); go.textContent = 'Ir até a camada';
    go.onclick = () => send({type:'focus', id:r.id});
    acts.appendChild(go);

    if(r.fix && !r.done){
      const fix = document.createElement('button'); fix.className = 'primary';
      fix.textContent = 'Corrigir para “' + r.fix.trim() + '”';
      fix.onclick = () => { send({type:'fix', id:r.id, text:r.fix}); fix.disabled = true; };
      acts.appendChild(fix);
    } else if(r.done){
      const ok = document.createElement('span'); ok.className = 'hint'; ok.textContent = 'corrigido';
      acts.appendChild(ok);
    } else if(r.decision === 'traduzir'){
      const s = document.createElement('span'); s.className = 'hint';
      s.textContent = r.prefer ? 'em frase — troque à mão' : 'sem termo preferido definido';
      acts.appendChild(s);
    }
    f.appendChild(acts);
    list.appendChild(f);
  });
}

$('#scan').onclick = () => {
  $('#scan').disabled = true;
  status('Verificando…');
  send({type:'scan'});
};

$('#close').onclick = () => send({type:'close'});

// Data no formato que se lê num relance, para saber se o plugin está velho.
function brDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  return m ? `${m[3]}/${m[2]}/${m[1]}` : '';
}

onmessage = (event) => {
  const msg = event.data.pluginMessage;
  if(!msg) return;
  if(msg.type === 'glossary'){
    const g = $('#gloss');
    g.textContent = '';
    const n = document.createElement('b');
    n.textContent = msg.active + (msg.active === 1 ? ' termo' : ' termos') + ' a evitar';
    g.appendChild(n);
    const d = brDate(msg.updated);
    if(d) g.appendChild(document.createTextNode(' · glossário de ' + d));
    // O glossário de exemplo não é decisão de ninguém — avisa em vez de deixar passar.
    if(/exemplo/i.test(msg.source || '')){
      g.appendChild(document.createElement('br'));
      const w = document.createElement('span');
      w.className = 'warn';
      w.textContent = 'glossário de exemplo — não é a decisão do time';
      g.appendChild(w);
    }
  }
  if(msg.type === 'results'){
    results = msg.results;
    $('#scan').disabled = false;
    const n = results.length;
    status(n ? n + (n === 1 ? ' ocorrência' : ' ocorrências') + ' em ' + msg.scope
             : 'Nada a corrigir em ' + msg.scope);
    $('#foot').textContent = msg.scanned + ' textos verificados';
    render();
  }
  if(msg.type === 'fixed'){
    const r = results.find(x => x.id === msg.id);
    if(r) r.done = true;
    render();
  }
  if(msg.type === 'gone'){
    results = results.filter(x => x.id !== msg.id);
    status('A camada não existe mais — lista atualizada.');
    render();
  }
  if(msg.type === 'error'){ $('#scan').disabled = false; status(msg.message, true); }
};

send({type:'ready'});
</script>
</body>
</html>
