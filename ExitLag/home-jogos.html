<title>ExitLag Jogos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..100,500..800&family=Ubuntu+Sans:wght@400;500;700&family=Ubuntu+Sans+Mono:wght@400;500&display=swap">
<style>
/* Layout: a game shelf. Top bar, category rail, a 3D cover-flow stage in the middle, and the focused game's
   session + details + actions centered underneath. Single dark look (the ExitLag desktop app is dark-only). */
:root {
  /* ExitLag DS tokens (from the desktop prototype) */
  --surface: #0b0c0f;
  --container: #111317;
  --container-high: #191d24;
  --input: #20242d;
  --on-surface: #ebeced;
  --on-surface-variant: #878d97;
  --divider: #313741;
  --stroke: #555c68;
  --primary: #f52929;
  --primary-deep: #5c0d10;
  --success: #22eba3;
  --warning: #eed80e;
  --alert: #eb8322;
  --font-display: "Anek Latin", "Ubuntu Sans", system-ui, sans-serif;
  --font: "Ubuntu Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Ubuntu Sans Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --cw: 214px; --ch: 296px; --step: 196px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--surface); color: var(--on-surface); font: 400 14px/20px var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--on-surface); outline-offset: 3px; }

.shell { min-height: 100%; display: flex; flex-direction: column; padding-inline: 24px;
  background: radial-gradient(60% 46% at 50% 38%, #f5292914 0%, #0b0c0f00 70%), var(--surface); }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 16px; padding-block: 16px 12px;
  background: linear-gradient(var(--surface) 70%, #0b0c0f00); }
.top .logo { height: 18px; width: auto; flex: none; }
.top .vsep { width: 1px; height: 20px; background: var(--divider); flex: none; }
.top h1 { margin: 0; font: 700 22px/1 var(--font-display); font-stretch: 75%; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.count { font: 500 12px/16px var(--font-mono); color: var(--on-surface-variant); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.count b { color: var(--primary); font-weight: 500; }
.opt-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 100px; box-shadow: inset 0 0 0 1px #f5292966; background: #f529291a;
  font: 500 12px/16px var(--font-mono); white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex: none; box-shadow: 0 0 8px var(--primary); }
.grow { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; width: min(320px, 40vw); height: 40px; padding: 0 8px 0 12px; border-radius: 6px; background: var(--container);
  box-shadow: inset 0 0 0 1px var(--divider); color: var(--on-surface-variant); transition: box-shadow .15s ease, background-color .15s ease; }
.search:focus-within { box-shadow: inset 0 0 0 1px var(--stroke); background: var(--container-high); }
.search svg { flex: none; }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--on-surface); }
.search input::placeholder { color: var(--on-surface-variant); }
kbd { padding: 1px 7px; border-radius: 4px; background: var(--input); box-shadow: inset 0 -1px 0 var(--stroke); font: 500 12px/18px var(--font-mono); color: var(--on-surface-variant); }

/* ---------- category rail ---------- */
.rail { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--divider); margin-bottom: 8px; }
.rail::-webkit-scrollbar { display: none; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 10px 12px 12px; white-space: nowrap; color: var(--on-surface-variant);
  font: 600 16px/20px var(--font-display); font-stretch: 75%; letter-spacing: .04em; text-transform: uppercase; transition: color .15s ease; }
.tab sup { font: 500 10px/1 var(--font-mono); letter-spacing: 0; color: var(--on-surface-variant); vertical-align: super; }
.tab:hover { color: var(--on-surface); }
.tab[aria-selected="true"] { color: var(--on-surface); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--primary); border-radius: 2px; }
.tab[aria-selected="true"] sup { color: var(--primary); }
.tab svg { width: 14px; height: 14px; }

/* ---------- cover-flow stage ---------- */
.stage { position: relative; overflow: hidden; height: calc(var(--ch) + 96px); perspective: 1400px; perspective-origin: 50% 40%; touch-action: pan-y; user-select: none; }
.track { position: absolute; inset: 0; transform-style: preserve-3d; }
.card { position: absolute; left: 50%; top: 28px; width: var(--cw); height: var(--ch); margin-left: calc(var(--cw) / -2); border-radius: 10px; overflow: hidden;
  background: var(--container-high); box-shadow: 0 24px 48px -16px #000000cc, inset 0 0 0 1px #ffffff12; text-align: left;
  transition: transform .5s cubic-bezier(.2, .8, .2, 1), filter .5s ease, opacity .4s ease, box-shadow .3s ease;
  -webkit-box-reflect: below 8px linear-gradient(#0000 72%, #ffffff1f); }
.card[hidden] { display: none; }
.card .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .type-art { position: absolute; inset: 0; overflow: hidden;
  background: repeating-linear-gradient(135deg, #ffffff05 0 1px, #0000 1px 9px), linear-gradient(165deg, var(--input), var(--container) 75%); }
.card .type-art span { position: absolute; left: -6px; bottom: 54px; font: 800 150px/.8 var(--font-display); font-stretch: 75%; text-transform: uppercase;
  color: #0000; -webkit-text-stroke: 1px #ffffff1f; white-space: nowrap; }
.card.on .type-art { background: repeating-linear-gradient(135deg, #ffffff08 0 1px, #0000 1px 9px), linear-gradient(165deg, var(--primary), var(--primary-deep) 62%, #1a0a0d); }
.card.on .type-art span { -webkit-text-stroke-color: #ffffff38; }
.card .shade { position: absolute; inset: 0; background: linear-gradient(180deg, #0b0c0f66 0%, #0b0c0f00 22%, #0b0c0f00 48%, #0b0c0fe6 100%); }
.card .idx { position: absolute; left: 12px; top: 10px; font: 500 11px/16px var(--font-mono); color: #ebeced99; }
.card .badge { position: absolute; right: 10px; top: 10px; display: none; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 100px;
  background: var(--primary); color: #fff; font: 500 10px/14px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
.card.on .badge { display: inline-flex; }
.card .meta { position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 2px; }
.card .genre { font: 500 10px/14px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--primary); }
.card .name { font: 700 26px/.95 var(--font-display); font-stretch: 75%; text-transform: uppercase; text-wrap: balance; color: #fff; }
.card.focus { box-shadow: 0 30px 60px -18px #000, 0 0 0 1px var(--stroke); }
.card.focus.on { box-shadow: 0 30px 60px -18px #000, 0 0 0 1.5px var(--primary), 0 0 48px -4px #f5292980; }
.card:not(.focus) { filter: brightness(.5) saturate(.85); }
.card:not(.focus):hover { filter: brightness(.7) saturate(.9); }
.nav { position: absolute; top: calc(28px + var(--ch) / 2 - 20px); z-index: 5; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: #111317cc; box-shadow: inset 0 0 0 1px var(--divider); color: var(--on-surface); transition: background-color .15s ease, opacity .15s ease; }
.nav:hover { background: var(--container-high); }
.nav[disabled] { opacity: .3; cursor: default; }
.nav.prev { left: 0; } .nav.next { right: 0; }
.empty { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; color: var(--on-surface-variant); }
.empty b { font: 700 28px/1 var(--font-display); font-stretch: 75%; text-transform: uppercase; color: var(--on-surface); }

/* ---------- focused game ---------- */
.detail { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-block: 4px 40px; text-align: center; }
.session { width: min(100%, 560px); border-radius: 8px; background: var(--container); box-shadow: inset 0 0 0 1px var(--divider); overflow: hidden; }
.session header { display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid var(--divider);
  font: 500 11px/16px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--on-surface-variant); }
.session header b { font-weight: 500; color: var(--on-surface); }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.stats div { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 12px; }
.stats div + div { box-shadow: inset 1px 0 0 var(--divider); }
.stats dt { min-height: 26px; display: grid; place-items: center; font: 500 10px/13px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--on-surface-variant); text-align: center; }
.stats dd { margin: 0; font: 700 20px/24px var(--font-mono); font-variant-numeric: tabular-nums; }
.stats dd small { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); margin-left: 1px; }
.good { color: var(--success); } .ok { color: var(--warning); } .bad { color: var(--alert); }
.nosession { padding: 14px; color: var(--on-surface-variant); }
.gname { margin: 6px 0 0; font: 800 clamp(44px, 7vw, 72px)/.9 var(--font-display); font-stretch: 75%; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { padding: 3px 10px; border-radius: 100px; box-shadow: inset 0 0 0 1px var(--divider); font: 500 12px/18px var(--font-mono); color: var(--on-surface); }
.chip.free { box-shadow: inset 0 0 0 1px #f5292999; color: #ff6b6b; }
.desc { max-width: 56ch; margin: 0; color: var(--on-surface-variant); font-size: 15px; line-height: 22px; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 6px; }
.btn { height: 40px; padding: 0 18px; border-radius: 6px; display: inline-flex; align-items: center; gap: 10px; font-weight: 500; white-space: nowrap;
  transition: background-color .15s ease, box-shadow .15s ease, color .15s ease; }
.btn.play { background: var(--on-surface); color: var(--surface); }
.btn.play:hover { background: #fff; }
.btn.optimize { background: var(--primary); color: #fff; }
.btn.optimize:hover { background: #ff3d3d; }
.btn.running { background: #f529291a; box-shadow: inset 0 0 0 1px #f5292999; color: var(--on-surface); padding-left: 14px; }
.btn.running:hover { background: #f5292933; }
.btn.running .timer { font: 500 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--on-surface-variant); }
.btn.running .stop { display: none; }
.btn.running:hover .lbl, .btn.running:focus-visible .lbl { display: none; }
.btn.running:hover .stop, .btn.running:focus-visible .stop { display: inline; }
.btn.running .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 50; transform: translate(-50%, calc(100% + 48px)); visibility: hidden; padding: 12px 16px; border-radius: 8px;
  background: var(--input); box-shadow: 0 12px 32px -8px #000c, inset 0 0 0 1px var(--divider); display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px);
  transition: transform .25s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .25s; }
.toast.show { transform: translate(-50%, 0); visibility: visible; transition-delay: 0s; }

@media (max-width: 760px) {
  :root { --cw: 168px; --ch: 232px; --step: 128px; }
  .shell { padding-inline: 16px; }
  .top { flex-wrap: wrap; }
  .top .logo, .top .vsep { display: none; }
  .search { width: 100%; order: 5; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stats div:nth-child(4) { box-shadow: none; }
  .stats div:nth-child(n+4) { border-top: 1px solid var(--divider); }
  .card .name { font-size: 21px; }
  .nav { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .toast { transition: none; }
  .btn.running .dot { animation: none; }
}
</style>

    return `<button class="card${x.on ? " on" : ""}" type="button" data-k="${k}" aria-label="${esc(x.n)}">${art}<span class="shade"></span>
      <span class="idx">${pad(k + 1)}</span><span class="badge">✦ Otimizado</span>
      <span class="meta"><span class="genre">${esc(x.g)}</span><span class="name">${esc(x.n)}</span></span></button>`;
  }
  function load(focus) {
    st.list = currentList();
    track.innerHTML = st.list.map(cardHTML).join("");
    $("#empty").hidden = st.list.length > 0;
    $("#empty-q").textContent = q.value.trim() ? `Ainda não temos “${q.value.trim()}”. Peça e avisamos quando chegar.` : "";
    $("#detail").hidden = !st.list.length;
    paintRail();
    go(Math.min(focus, Math.max(0, st.list.length - 1)), true);
  }
  function layout() {
    const step = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--step")) || 196;
    [...track.children].forEach((c, k) => {
      const d = k - st.i, a = Math.abs(d);
      c.hidden = a > 4;
      c.classList.toggle("focus", d === 0);
      c.setAttribute("aria-current", d === 0 ? "true" : "false");
      c.tabIndex = d === 0 ? 0 : -1;
      const x = d === 0 ? 0 : Math.sign(d) * (step * 0.62 + a * step * 0.78);
      c.style.transform = `translateX(${x}px) translateZ(${-a * 90}px) rotateY(${d === 0 ? 0 : -Math.sign(d) * 24}deg)`;
      c.style.zIndex = 100 - a;
      c.style.opacity = a > 3 ? 0 : 1;
    });
    $("#prev").disabled = st.i <= 0;
    $("#next").disabled = st.i >= st.list.length - 1;
  }
  function go(i, quiet) {
    if (!st.list.length) return;
    st.i = Math.max(0, Math.min(st.list.length - 1, i));
    layout();
    paintDetail();
    if (!quiet) track.children[st.i]?.focus({ preventScroll: true });
  }

  // ---- focused game ----
  const game = () => st.list[st.i];
  function paintDetail() {
    const x = game();
    if (!x) return;
    $("#session").innerHTML = x.s
      ? `<header><span>Última sessão</span><b>${ago(x.s[5])}</b></header><dl class="stats">
          <div><dt>Duração</dt><dd>${dur(x.s[0])}</dd></div>
          <div><dt>Menor ping</dt><dd class="${tone(x.s[1], 40, 80)}">${x.s[1]}<small>ms</small></dd></div>
          <div><dt>Ping médio</dt><dd class="${tone(x.s[2], 40, 80)}">${x.s[2]}<small>ms</small></dd></div>
          <div><dt>Jitter médio</dt><dd>${num(x.s[3], 1)}<small>ms</small></dd></div>
          <div><dt>Perda de pacotes</dt><dd class="${x.s[4] === 0 ? "good" : tone(x.s[4], 0, 2)}">${num(x.s[4], 2)}<small>%</small></dd></div></dl>`
      : `<header><span>Última sessão</span><b>—</b></header><p class="nosession">Ainda sem sessões. Os números aparecem depois da primeira partida otimizada.</p>`;
    $("#gname").textContent = x.n;
    $("#chips").innerHTML = `<span class="chip">${esc(x.p)}</span><span class="chip">${x.y}</span>${x.free ? '<span class="chip free">Grátis para jogar</span>' : ""}`;
    $("#desc").textContent = x.d;
    paintOpt();
    $("#play").innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>Jogar ${esc(x.n)}`;
  }
  function paintOpt() {
    const x = game(), b = $("#opt");
    if (!x) return;
    b.className = "btn " + (x.on ? "running" : "optimize");
    b.setAttribute("aria-pressed", String(!!x.on));
    b.innerHTML = x.on
      ? `<span class="dot" aria-hidden="true"></span><span class="lbl">Otimizado</span><span class="stop">Parar otimização</span><span class="timer">${clock(x.t || 0)}</span>`
      : `${ICON_BOLT.replace("<svg", '<svg width="14" height="14"')}Otimizar ${esc(x.n)}`;
  }
  $("#opt").addEventListener("click", () => {
    const x = game();
    x.on = !x.on;
    x.t = x.t || 0;
    track.children[st.i].classList.toggle("on", !!x.on);
    paintOpt(); paintRail();
    toast(x.on ? `Rota otimizada para ${x.n}` : `Otimização de ${x.n} parada`);
  });
  $("#play").addEventListener("click", () => { const x = game(); toast(x.on ? `Abrindo ${x.n} com rota otimizada` : `Abrindo ${x.n} sem otimização`); });
  $("#request").addEventListener("click", () => toast(`Pedido enviado: ${q.value.trim()}`));
  // optimized time keeps counting for every optimized game
  setInterval(() => { GAMES.forEach((x) => { if (x.on) x.t = (x.t || 0) + 1; }); const t = $("#opt .timer"); if (t && game()?.on) t.textContent = clock(game().t); }, 1000);

  let toastT = 0;
  function toast(text) {
    $("#toast-t").textContent = text;
    $("#toast").classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(() => $("#toast").classList.remove("show"), 2600);
  }

  // ---- input: click, arrows, wheel, drag, search ----
  track.addEventListener("click", (e) => { const c = e.target.closest(".card"); if (c && !dragMoved) go(+c.dataset.k); });
  $("#prev").addEventListener("click", () => go(st.i - 1));
  $("#next").addEventListener("click", () => go(st.i + 1));
  document.addEventListener("keydown", (e) => {
    const typing = e.target.closest("input, textarea");
    if (e.key === "/" && !typing) { e.preventDefault(); q.focus(); return; }
    if (e.key === "Escape" && typing) { q.value = ""; load(0); q.blur(); return; }
    if (typing || e.altKey || e.metaKey || e.ctrlKey) return;
    const to = { ArrowLeft: st.i - 1, ArrowRight: st.i + 1, Home: 0, End: st.list.length - 1 }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    go(to);
  });
  let wheelAt = 0;
  stage.addEventListener("wheel", (e) => {
    const dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.shiftKey ? e.deltaY : 0;
    if (!dx) return;
    e.preventDefault();
    const now = performance.now();
    if (now - wheelAt < 220) return;
    wheelAt = now;
    go(st.i + Math.sign(dx), true);
  }, { passive: false });
  let dragX = null, dragMoved = false, dragFrom = 0;
  stage.addEventListener("pointerdown", (e) => { if (e.target.closest(".nav, .empty")) return; dragX = e.clientX; dragFrom = st.i; dragMoved = false; });
  addEventListener("pointermove", (e) => {
    if (dragX == null) return;
    const steps = Math.round((dragX - e.clientX) / 90);
    if (steps) dragMoved = true;
    if (st.i !== dragFrom + steps) go(dragFrom + steps, true);
  });
  addEventListener("pointerup", () => { dragX = null; setTimeout(() => (dragMoved = false), 0); });
  q.addEventListener("input", () => {
    if (q.value.trim()) rail.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", "false"));
    load(0);
  });
  addEventListener("resize", layout);

  // open on Roblox, like the reference
  const first = TABS.find((t) => t.id === st.tab).pick().findIndex((x) => x.n === "Roblox");
  load(first < 0 ? 0 : first);
})();
</script>
