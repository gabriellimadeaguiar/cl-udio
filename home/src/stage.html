          <!-- Fileira original de card-app, vazia: o script do protótipo ainda a procura -->
          <div class="apps" hidden style="display:none"><div class="card-add"><img src="{{ADD}}" alt=""></div></div>
          <!-- Palco: jogos em carrossel com o globo de rotas ao lado do jogo em destaque -->
          <div class="pk" id="pk" aria-label="Games stage">
            <div class="pk-amb" id="pkAmbA"></div><div class="pk-amb" id="pkAmbB"></div>
            <div class="pk-l">
              <div class="pk-deck" id="pkDeck" role="listbox" tabindex="0" aria-label="Games">
                <div class="pk-spot"></div><div class="pk-floor"></div>
              </div>
              <button class="icon-btn outlined pk-add-btn" type="button" id="pkAddBtn" aria-label="Add game or app" data-tip="Add game or app"><img src="{{ADD}}" alt=""></button>
              <div class="pk-info">
                <div class="pk-r1">
                  <h3 id="pkTitle" aria-live="polite"></h3>
                  <div class="pk-pg">
                    <button class="icon-btn" type="button" id="pkPrev" aria-label="Previous game"><img src="{{PREV}}" alt=""></button>
                    <span class="tnum" id="pkPage">1</span><span>of</span><span class="tnum" id="pkTotal"></span>
                    <button class="icon-btn" type="button" id="pkNext" aria-label="Next game"><img src="{{NEXT}}" alt=""></button>
                  </div>
                </div>
                <div class="pk-r2">
                  <div class="pk-srv" id="pkSrv">
                    <button class="pill" type="button" id="pkSrvBtn" aria-haspopup="listbox" aria-expanded="false"><span class="t-var">Server</span><span id="pkSrvName"></span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg></button>
                    <div class="search-list" id="pkSrvList" role="listbox" aria-label="Game server" hidden><div class="sl-scroll" id="pkSrvItems"></div></div>
                  </div>
                  <span class="pk-plat t-var"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M0 0h11.4v11.4H0zM12.6 0H24v11.4H12.6zM0 12.6h11.4V24H0zM12.6 12.6H24V24H12.6z"/></svg>PC</span>
                  <span class="grow"></span>
                  <button class="btn filled pk-cta" type="button" id="pkCta"></button>
                </div>
              </div>
            </div>
            <div class="pk-r">
              <canvas id="pkGl" role="img" aria-label="Globe with the routes between you and the game server"></canvas>
              <div class="pk-head">
                <span class="badge neutral"><span class="live-dot"></span>Live</span>
                <span class="pk-route tnum" id="pkRoute"></span>
                <span class="grow"></span>
                <span class="legend" id="pkLgXl"><span class="dt xl"></span><span class="t-em">ExitLag</span></span>
                <span class="legend"><span class="dt isp"></span><span class="t-em">ISP</span></span>
              </div>
              <div class="widget pk-tele" id="pkTele">
                <div class="w-head"><div class="w-title"><img src="{{MON}}" alt=""><h4>Route Monitoring</h4></div><span class="badge" id="pkState"></span></div>
                <div class="pk-kpis">
                  <div class="pk-kpi"><span class="t-var">Ping</span><span class="v tnum"><span id="kPing">–</span><small>ms</small></span><span class="vs"><span class="badge success tnum" id="kDelta" style="display:none"></span><span id="kPingVs"></span></span></div>
                  <div class="pk-kpi"><span class="t-var">Jitter</span><span class="v tnum"><span id="kJit">–</span><small>ms</small></span><span class="vs" id="kJitVs"></span></div>
                  <div class="pk-kpi"><span class="t-var">Packet loss</span><span class="v tnum"><span id="kLoss">–</span><small>%</small></span><span class="vs" id="kLossVs"></span></div>
                  <div class="pk-kpi"><span class="t-var">Active routes</span><span class="v tnum"><span id="kRoutes">–</span><small id="kRoutesOf"></small></span><span class="vs" id="kRoutesVs"></span></div>
                </div>
                <div class="chart-wrap"><svg viewBox="0 0 498 33" preserveAspectRatio="none" role="img" aria-label="Live ping chart, ISP and ExitLag">
                  <path id="pkIspPath" fill="none" stroke="#EB8322" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
                  <path id="pkXlPath" fill="none" stroke="#22EBA3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
                </svg></div>
                <div class="pk-lanes" id="pkLanes"></div>
                <div class="pk-log"><span class="tnum" id="pkLogT"></span><span id="pkLog"></span></div>
              </div>
            </div>
          </div>
          <!-- Dialog "Add game or app": comp / modal dialog do protótipo, com o input-search e itens da search-list. O script o leva para junto do #md-overlay. -->
          <div class="modal dialog pk-add" id="pkAdd" role="dialog" aria-modal="true" aria-labelledby="pkAddT" hidden>
            <div class="md-body">
              <div class="md-head"><h3 id="pkAddT">Add game or app</h3></div>
              <label class="search"><img id="pkAddIco" src="" alt=""><input type="search" id="pkAddIn" placeholder="Search games" aria-label="Search games" autocomplete="off"></label>
              <div class="sl-scroll pk-add-list" id="pkAddList" role="listbox" aria-label="Games you can add"></div>
            </div>
            <div class="md-foot"><button class="btn outlined" type="button" id="pkAddCancel">Cancel</button></div>
          </div>
