name: Coleta diária

# IMPORTANTE: o gatilho 'schedule' só dispara a partir do branch PADRÃO do repo.
# Enquanto este workflow não estiver no branch padrão, use "Run workflow" (manual).
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC ≈ 06:00 BRT
  workflow_dispatch:
    inputs:
      data:
        description: "Forçar uma data (YYYY-MM-DD). Vazio = hoje."
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Rodar coleta
        id: coleta
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELO: ${{ vars.MODELO }}
          DATA_COLETA: ${{ github.event.inputs.data }}
        run: node scripts/coletar.mjs

      - name: Commit dos dados
        if: always()
        run: |
          git config user.name "exitlag-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then
            echo "Nada para commitar."
          else
            DIA="${{ github.event.inputs.data }}"
            [ -z "$DIA" ] && DIA="$(date -u +%F)"
            git commit -m "dados: coleta $DIA"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Notificar falha (abre/atualiza issue)
        if: steps.coleta.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const dia = process.env.DIA || new Date().toISOString().slice(0,10);
            const titulo = `Coleta falhou (${dia})`;
            const corpo = `A coleta diária falhou. O dia foi registrado como "sem-coleta" no histórico.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "coleta-falhou",
            });
            if (issues.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body: corpo,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titulo, body: corpo, labels: ["coleta-falhou"],
              });
            }
        env:
          DIA: ${{ github.event.inputs.data }}

      - name: Falhar o run se a coleta falhou
        if: steps.coleta.outcome == 'failure'
        run: exit 1
