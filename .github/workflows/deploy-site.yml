name: Publicar site (GitHub Pages)

# Republica o site sempre que os dados ou o site mudarem.
# Pré-requisito: Settings → Pages → Source = "GitHub Actions".
on:
  push:
    paths:
      - "site/**"
      - "dados/**"
      - "config/**"
      - ".github/workflows/deploy-site.yml"
  # A coleta diária commita via GITHUB_TOKEN, e um push assim NÃO dispara o gatilho
  # 'push' acima. Este 'workflow_run' garante que o site republique após cada coleta.
  workflow_run:
    workflows: ["Coleta diária"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Montar _site
        run: node scripts/montar-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
